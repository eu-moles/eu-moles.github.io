baseURL = 'https://eu-moles.github.io/'
publishDir = '../docs'
cleanDestinationDir = true
locale = 'en-us'
title = 'EU Moles'

[HTTPCache.cache.for]
  excludes = []
  includes = ['**/meps/en/full-list/xml']

[params]
  description = 'A source-first research directory for examining pro-Kremlin positions in the European Parliament.'
  featured_image_class = 'cover bg-bottom'

[params.ananke]
  show_recent_posts = false
  custom_css = ['css/site.css']

[taxonomies]
  category = 'categories'
  tag = 'tags'

[[menus.main]]
  name = 'Home'
  pageRef = '/'
  weight = 10

[[menus.main]]
  name = 'MEPs'
  pageRef = '/meps'
  weight = 20

[[menus.main]]
  name = 'Countries'
  pageRef = '/countries'
  weight = 30

[[menus.main]]
  name = 'Political Groups'
  pageRef = '/groups'
  weight = 40

[[menus.main]]
  name = 'National Parties'
  pageRef = '/national-parties'
  weight = 50

[[menus.main]]
  name = 'Methodology'
  pageRef = '/methodology'
  weight = 60

[module]

[[module.imports]]
  disable = false
  ignoreConfig = false
  ignoreImports = false
  path = 'github.com/gohugo-ananke/ananke/v2'
