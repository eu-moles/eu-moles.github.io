baseURL = 'https://eu-moles.github.io/'
publishDir = '../docs'
cleanDestinationDir = true
locale = 'en-us'
title = 'EU Moles'
disableKinds = ['taxonomy', 'term']
enableRobotsTXT = true

# Keep Hugo's generated asset and image caches outside the source tree. Source
# CSS, JavaScript, images, SVGs, and the favicon live in assets/ and are
# minified or fingerprinted when referenced by templates.
[caches]
  [caches.assets]
    dir = ':cacheDir/:project/assets'
    maxAge = -1
  [caches.images]
    dir = ':cacheDir/:project/images'
    maxAge = -1

[params]
  description = 'A source-first research directory for examining pro-Kremlin positions in the European Parliament.'
  featured_image_class = 'cover bg-bottom'
  site_logo = '/images/eu-moles-emblem.svg'
  favicon = '/favicon.ico'

[params.ananke]
  show_recent_posts = false

[[menus.main]]
  name = 'Home'
  pageRef = '/'
  weight = 10

[[menus.main]]
  name = 'MEPs'
  pageRef = '/meps'
  weight = 20

[[menus.main]]
  name = 'Motions'
  pageRef = '/motions'
  weight = 30

[module]

[[module.imports]]
  disable = false
  ignoreConfig = false
  ignoreImports = false
  path = 'github.com/gohugo-ananke/ananke/v2'

  # Recreate Ananke's default mounts, intentionally omitting static/. Its only
  # static file is an unused demonstration hero image.
  [[module.imports.mounts]]
    source = 'archetypes'
    target = 'archetypes'
  [[module.imports.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.imports.mounts]]
    source = 'content'
    target = 'content'
  [[module.imports.mounts]]
    source = 'data'
    target = 'data'
  [[module.imports.mounts]]
    source = 'i18n'
    target = 'i18n'
  [[module.imports.mounts]]
    source = 'layouts'
    target = 'layouts'
