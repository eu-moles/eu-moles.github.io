baseURL = 'https://eu-moles.github.io/'
publishDir = '../docs'
cleanDestinationDir = true
locale = 'en-us'
title = 'EU Moles'
disableKinds = ['taxonomy', 'term']

[params]
  description = 'A source-first research directory for examining pro-Kremlin positions in the European Parliament.'
  featured_image_class = 'cover bg-bottom'
  site_logo = '/images/eu-moles-emblem.svg'
  favicon = '/favicon.ico'

[params.ananke]
  show_recent_posts = false
  custom_css = ['css/site.css']

[[menus.main]]
  name = 'Home'
  pageRef = '/'
  weight = 10

[[menus.main]]
  name = 'MEPs'
  pageRef = '/meps'
  weight = 20

[[menus.main]]
  name = 'Motions'
  pageRef = '/motions'
  weight = 30

[module]

[[module.imports]]
  disable = false
  ignoreConfig = false
  ignoreImports = false
  path = 'github.com/gohugo-ananke/ananke/v2'
